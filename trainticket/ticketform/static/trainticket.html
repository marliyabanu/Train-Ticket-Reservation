<!DOCTYPE html>
<html>
<head>
<title>Train Ticket Reservation</title>

<style>

body{
    background:#f2f2f2;
    font-family:"Times New Roman";
}

.container{
    width:700px;
    margin:30px auto;
    background:#d3d3d3;
    padding:30px;
    border-radius:20px;
    box-shadow:8px 8px 15px gray;
}

h1{
    text-align:center;
    color:blue;
    font-size:50px;
}

h2{
    text-align:center;
    color:blue;
}

hr{
    border:1px solid red;
}

table{
    width:100%;
    font-size:22px;
    color:darkblue;
    font-weight:bold;
}

td{
    padding:12px;
}

input,select{
    padding:5px;
    font-size:16px;
}

button{
    background:pink;
    padding:8px 15px;
    border:none;
    font-size:18px;
}

.center{
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>Train Ticket Reservation</h1>

<hr>

<h2>B MARLIYA BANU 212225040229 </h2>

<form>

<table>

<tr>
<td>From Station:<span style="color:red;">*</span></td>

<td>
<select>
<option>Select Departure Station</option>
<option>Chennai</option>
<option>Madurai</option>
<option>Coimbatore</option>
<option>Trichy</option>
</select>
</td>
</tr>

<tr>
<td>To Station:<span style="color:red;">*</span></td>

<td>
<select>
<option>Select Arrival Station</option>
<option>Bangalore</option>
<option>Salem</option>
<option>Nagercoil</option>
<option>Erode</option>
</select>
</td>
</tr>

<tr>
<td>Travel Date*:</td>
<td>
<input type="date">
</td>
</tr>

</table>

<h2>Passenger Details</h2>

<hr>

<table>

<tr>
<td>Name:<span style="color:red;">*</span></td>
<td>
<input type="text" placeholder="Enter your Name">
</td>
</tr>

<tr>
<td>Age:<span style="color:red;">*</span></td>
<td>
<input type="number">
</td>
</tr>

<tr>
<td>Gender:<span style="color:red;">*</span></td>

<td>
<input type="radio" name="g"> Male
<input type="radio" name="g"> Female
<input type="radio" name="g"> Transgender
</td>
</tr>

<tr>
<td>Berth Preference:</td>

<td>
<select>
<option>--Select--</option>
<option>Lower</option>
<option>Middle</option>
<option>Upper</option>
</select>
</td>
</tr>

<tr>
<td>Meal Preference:</td>

<td>
<select>
<option>--Select--</option>
<option>Veg</option>
<option>Non-Veg</option>
</select>
</td>
</tr>

<tr>
<td>Class:<span style="color:red;">*</span></td>

<td>
<select>
<option>Sleeper</option>
<option>AC</option>
<option>First Class</option>
</select>
</td>
</tr>

<tr>
<td>Number of Seats:<span style="color:red;">*</span></td>

<td>
<select>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
</select>
</td>
</tr>

<tr>
<td>Mobile Number:<span style="color:red;">*</span></td>

<td>
<input type="text" placeholder="Enter Your Phone Number">
</td>
</tr>

<tr>
<td>E-mail Address:<span style="color:red;">*</span></td>

<td>
<input type="email" placeholder="Enter Your Email Address">
</td>
</tr>

</table>

<div class="center">
<button>Book Ticket</button>

<button type="reset">Clear All</button>
</div>

</form>

</div>

</body>
</html>
